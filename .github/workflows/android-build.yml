name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Fix Icons, Styles and ML Kit Code API
        run: |
          sed -i 's/android:icon="@mipmap\/ic_launcher"//g' app/src/main/AndroidManifest.xml || true
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' app/src/main/AndroidManifest.xml || true
          sed -i 's/Widget.Material3.Button.Tonal/Widget.Material3.Button.TonalButton/g' app/src/main/res/layout/activity_process_text.xml || true
          sed -i 's/Widget.Material3.Button.Tonal/Widget.Material3.Button.TonalButton/g' app/src/main/res/layout/item_language_model.xml || true
          sed -i 's/getModels(TranslateRemoteModel::class.java)/getDownloadedModels(TranslateRemoteModel::class.java)/g' app/src/main/java/com/translator/offline/MainActivity.kt || true

      - name: Generate Build Configurations
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TextTranslatorApp"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.translator.offline"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.translator.offline"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("com.google.mlkit:translate:17.0.2")
              implementation("com.google.mlkit:language-id:17.0.5")
          }
          EOF

      - name: Build APK Clean
        run: gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextTranslatorApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
